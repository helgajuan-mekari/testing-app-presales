<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Request</title><style>body{margin:0;padding:24px;background:#f3f5f8}#ps-request{max-width:1050px;margin:auto}
#ps-request{font:14px/1.5 system-ui;color:light-dark(#273044,#e7ebf3);background:light-dark(#fff,#202633);border:1px solid light-dark(#dde2ec,#465164);border-radius:14px;overflow:hidden;color-scheme:light dark}#ps-request *{box-sizing:border-box}#ps-request header{padding:22px 26px;border-bottom:1px solid light-dark(#dde2ec,#465164)}#ps-request h2{font-size:23px;margin:0 0 5px;font-weight:600}#ps-request .sub{color:light-dark(#626c7e,#b4bfd1);font-size:12px}#ps-request nav{display:flex;gap:8px;padding:16px 26px 0;flex-wrap:wrap}#ps-request button{font:inherit;border:1px solid light-dark(#bac4d5,#66758b);border-radius:8px;padding:9px 15px;background:light-dark(#fff,#293244);color:inherit}#ps-request button[aria-pressed=true],#ps-request .primary{background:light-dark(#158c80,#4dd0bb);color:light-dark(#fff,#122c28);border-color:transparent}#ps-request .pane{padding:20px 26px}#ps-request .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}#ps-request label{display:block;font-weight:500}#ps-request input:not([type=checkbox]),#ps-request select,#ps-request textarea{display:block;width:100%;min-width:0;font:inherit;padding:10px;border:1px solid light-dark(#b9c3d8,#66758b);border-radius:6px;margin-top:6px;background:light-dark(#fff,#252e3e);color:inherit}#ps-request textarea{min-height:76px;resize:vertical}#ps-request h3{font-size:16px;font-weight:600;margin:23px 0 12px}#ps-request .checks{display:flex;gap:16px;flex-wrap:wrap}#ps-request .checks label{display:flex;align-items:center;gap:7px}#ps-request input[type=checkbox]{accent-color:#159b89;width:17px;height:17px}#ps-request .section{padding:15px 0;border-bottom:1px solid light-dark(#e2e7ef,#465164)}#ps-request .section h3{margin:0 0 10px}#ps-request .note{padding:10px 12px;background:light-dark(#edf8f5,#263e3c);border-radius:6px;margin:14px 0}#ps-request .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}#ps-request [hidden]{display:none!important}#ps-request .full{grid-column:1/-1}#ps-request .record{padding:12px 0;border-bottom:1px solid light-dark(#e2e7ef,#465164)}@media(max-width:520px){#ps-request .grid{grid-template-columns:1fr}#ps-request header,#ps-request .pane{padding:18px}#ps-request nav{padding:15px 18px 0}}
</style></head><body><div id="ps-request"><header><h2>Sales Request</h2><div class="sub">Interactive mockup • Not connected to Zoho</div></header><div class="pane" id="ps-sales">
<form id="ps-form">
<label>Request For *<select id="ps-mode" required><option value="new">New Project</option><option value="existing">Update existing project</option></select></label>
<div id="ps-existing" hidden class="section"><div class="note">Project details are populated from the existing request you opened.</div><div class="record">RFI · Completed <span class="sub">— history retained</span></div></div>
<h3>Project information</h3>
<div class="grid">
<label>Requester Division *<select required><option>Enterprise Sales B</option><option>Enterprise Sales A</option><option>Sales</option><option>Specialist/Activation</option><option>Customer Success</option><option>Account Manager</option><option>Other</option></select></label>
<label>Request Email *<input type="email" required placeholder="name@company.com"></label>
<label>Company Name *<input required value="Tipsea Turtle"></label>
<label>Product *<select required><option>HRIS</option><option>Customer Management &amp; Omnichannel</option><option>Accounting, Finance, and ERP</option><option>Expense</option><option>Commerce</option><option>Tax</option><option>Custom Application &amp; Custom Workflow</option><option>Digital E-Sign &amp; e-Materai</option><option>Other</option></select></label>
<label>Project type *<select id="ps-kind"><option value="non">Non-Tender</option><option value="tender">Tender</option></select></label>
<label id="ps-tender" hidden class="full">Tender submission deadline *<input type="date"></label>
<label class="full">Request details / Requirements summary *<textarea required placeholder="Objectives, client context, and required support"></textarea></label>
</div>
<h3 id="ps-needs-title">Current support needs *</h3>
<div class="checks"><label><input type="checkbox" data-need="rfi" checked>RFI</label><label><input type="checkbox" data-need="meeting">Meeting</label><label><input type="checkbox" data-need="proposal" checked>Technical Proposal</label><label><input type="checkbox" data-need="poc">POC</label><label><input type="checkbox" data-need="reproduction">Reproduction</label></div>
<section class="section" id="ps-rfi"><h3>RFI</h3><div class="grid"><label>RFI deadline *<input type="date" required></label><label>RFI document link *<input type="url" required placeholder="https://…"></label></div></section>
<section class="section" id="ps-meeting" hidden><h3>Meeting</h3><div class="grid"><label>Schedule<span id="ps-schedule-star"> *</span><select id="ps-schedule"><option value="">Select schedule status</option><option value="unknown">Not yet confirmed</option><option value="known">Proposed schedule available</option></select></label><label id="ps-date" hidden>Date & time *<input type="datetime-local"></label><label class="full">Meeting agenda / Objectives *<textarea placeholder="Discovery, requirements clarification, or solution discussion"></textarea></label><label class="full">Meeting link / Location<span id="ps-location-star"> *</span><input id="ps-location" placeholder="Enter meeting URL or physical location"></label></div></section>
<section class="section" id="ps-proposal"><h3>Technical Proposal</h3><div class="grid"><label>Technical Proposal deadline *<input type="date" required></label><label>Requirements source *<select><option>Attached RFI</option><option>BRD / requirement list</option><option>Meeting minutes</option><option>Not available — discovery required</option></select></label><label class="full">Additional reference link<input type="url" placeholder="https://…"></label></div></section>
<section class="section" id="ps-poc" hidden><h3>POC (Proof of Concept)</h3><div class="grid"><label>Estimated start date *<input type="date" id="ps-poc-start" required></label><label>Estimated end date *<input type="date" id="ps-poc-end" required></label><label class="full">POC objectives / Scope *<textarea required placeholder="Features or processes to test with the client"></textarea></label><label class="full">Expected outcomes / Success criteria *<textarea required placeholder="Results required for the POC to be considered successful"></textarea></label><label class="full">Scenario / Supporting data link<input type="url" placeholder="https://…"></label></div></section>
<section class="section" id="ps-reproduction" hidden><h3>Reproduction</h3><div class="grid"><label>Estimated start date *<input type="date" id="ps-reproduction-start" required></label><label>Estimated end date *<input type="date" id="ps-reproduction-end" required></label><label class="full">Scenario to reproduce *<textarea required placeholder="Client conditions, steps, or processes to reproduce"></textarea></label><label class="full">Expected outcomes *<textarea required placeholder="Results to validate for this scenario"></textarea></label><label class="full">Example case / Supporting data link<input type="url" placeholder="https://…"></label></div></section>
<section class="section"><label>Other supporting documents<span id="ps-docs-star"> *</span><input id="ps-docs" type="url" placeholder="Client folder / Document link"></label></section>
<div class="actions"><button class="primary" type="submit" id="ps-submit">Submit request</button></div>
<div id="ps-message" class="note" hidden aria-live="polite"></div>
</form>
</div>
</div><script>(()=>{const root=document.getElementById('ps-request');const get=id=>root.querySelector('#ps-'+id);
function needs(){root.querySelectorAll('[data-need]').forEach(c=>{const panel=get(c.dataset.need);panel.hidden=!c.checked;panel.querySelectorAll('input,select,textarea').forEach(x=>x.disabled=!c.checked);if(c.dataset.need==='meeting'){panel.querySelector('textarea').required=c.checked;get('date').querySelector('input').required=c.checked&&get('schedule').value==='known';get('schedule').required=c.checked;get('location').required=c.checked;get('schedule-star').hidden=false;get('location-star').hidden=false}});const docsRequired=Boolean(root.querySelector('[data-need="rfi"]:checked,[data-need="proposal"]:checked'));get('docs').required=docsRequired;get('docs-star').hidden=!docsRequired}root.querySelectorAll('[data-need]').forEach(c=>c.addEventListener('change',needs));needs();
get('mode').addEventListener('change',()=>{const existing=get('mode').value==='existing';get('existing').hidden=!existing;get('submit').textContent=existing?'Add to project':'Submit request';get('needs-title').textContent=existing?'Additional support needs *':'Current support needs *';needs()});
get('kind').addEventListener('change',()=>{const on=get('kind').value==='tender';get('tender').hidden=!on;get('tender').querySelector('input').required=on});get('schedule').addEventListener('change',()=>{get('date').hidden=get('schedule').value!=='known';needs()});
['poc','reproduction'].forEach(kind=>{const start=get(kind+'-start'),end=get(kind+'-end');function dates(){end.min=start.value;end.setCustomValidity(start.value&&end.value&&end.value<start.value?'The end date cannot be earlier than the start date.':'')}start.addEventListener('input',dates);end.addEventListener('input',dates)});
function message(s){get('message').hidden=false;get('message').textContent=s}get('form').addEventListener('submit',e=>{e.preventDefault();if(!root.querySelector('[data-need]:checked'))return message('Select at least one support need.');message(get('mode').value==='existing'?'Preview: activities added to the same project. Not connected to Zoho.':'Preview: one project created with the selected activities. Not connected to Zoho.')});})();</script></body></html>
